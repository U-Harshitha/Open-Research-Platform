# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo → paste GROQ_API_KEY and OPENALEX_API_KEY when asked → Apply.
#
# Creates two services:
#   open-research-nexus      static site (React), served under /research
#   open-research-nexus-api  Flask AI service (Groq + OpenAlex)
# The portfolio proxies /research to the static site (see its vercel.json),
# the same way it proxies /hangman to the Phoenix app.
services:
  - type: web
    name: open-research-nexus
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_BASE_PATH
        value: /research/
      # Render passes the API's service name; the app turns it into its https URL.
      - key: VITE_API_URL
        fromService:
          type: web
          name: open-research-nexus-api
          property: host
      - key: VITE_PORTFOLIO_URL
        value: https://harshitha-upadhyayula.vercel.app
    headers:
      - path: /research/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: redirect
        source: /
        destination: /research/
      - type: rewrite
        source: /research
        destination: /research/index.html
      - type: rewrite
        source: /research/*
        destination: /research/index.html

  - type: web
    name: open-research-nexus-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ai_service_api:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Free key: console.groq.com → API Keys. Drafting, review, summaries.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Free key: openalex.org → Settings → API. Real papers for Find.
      - key: OPENALEX_API_KEY
        sync: false
      # Browser origins allowed to call the API. If Render gives the static
      # site a different URL (e.g. with a suffix), update the second entry.
      - key: ALLOWED_ORIGINS
        value: https://harshitha-upadhyayula.vercel.app,https://open-research-nexus.onrender.com,http://localhost:3000
